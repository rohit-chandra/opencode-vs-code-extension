name: Release

# Push a tag like v0.2.0 (matching "version" in package.json), or publish a release with
# that tag from the Releases page, to build, test and attach the .vsix.
on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]

permissions:
  contents: write

# Publishing from the Releases page can fire both the tag push and the release event.
# Run them one after the other; the second only re-uploads the same files.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests with the real CLIs
        run: |
          npm install -g opencode-ai @anthropic-ai/claude-code @openai/codex
          npm run test:e2e
      - name: Package
        run: |
          npm run build:prod
          npx vsce package --no-dependencies -o "opencode-hub-$VERSION.vsix"
          sha256sum "opencode-hub-$VERSION.vsix" > "opencode-hub-$VERSION.vsix.sha256"
      - name: Release notes from the changelog
        run: |
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $VERSION" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist when the tag was created from the Releases page.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "opencode-hub-$VERSION.vsix" "opencode-hub-$VERSION.vsix.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "opencode-hub-$VERSION.vsix" "opencode-hub-$VERSION.vsix.sha256" --title "OpenCode Hub $VERSION" --notes-file notes.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: opencode-hub-${{ env.VERSION }}.vsix
          if-no-files-found: error

  publish:
    # Optional stores. The tokens are only exposed to this job, and each step runs only
    # when its token is configured as a repository secret.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath opencode-hub-*.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish opencode-hub-*.vsix -p "$OVSX_PAT"
