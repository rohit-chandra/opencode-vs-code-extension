<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenCode Hub webview harness</title>
<link rel="icon" href="data:," />
<style>
  /* Stand-ins for the variables VS Code injects into webviews (Dark Modern / Light Modern). */
  body.vscode-dark {
    --vscode-foreground: #cccccc; --vscode-descriptionForeground: #9d9d9d; --vscode-sideBar-background: #181818;
    --vscode-editor-background: #1f1f1f; --vscode-editorWidget-background: #202020; --vscode-widget-border: #313131;
    --vscode-input-background: #313131; --vscode-input-border: #3c3c3c; --vscode-input-foreground: #cccccc;
    --vscode-input-placeholderForeground: #989898; --vscode-focusBorder: #0078d4; --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #04395e; --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-button-background: #0078d4; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #026ec1;
    --vscode-button-secondaryBackground: #313131; --vscode-button-secondaryForeground: #cccccc; --vscode-button-secondaryHoverBackground: #3c3c3c;
    --vscode-textLink-foreground: #4daafc; --vscode-textCodeBlock-background: #2b2b2b; --vscode-badge-background: #616161;
    --vscode-badge-foreground: #f8f8f8; --vscode-menu-background: #1f1f1f; --vscode-menu-foreground: #cccccc;
    --vscode-widget-shadow: rgba(0,0,0,.36); --vscode-notifications-background: #202020; --vscode-icon-foreground: #cccccc;
    --vscode-toolbar-hoverBackground: rgba(90,93,94,.31); --vscode-textBlockQuote-border: #616161;
    background: #181818;
  }
  body.vscode-light {
    --vscode-foreground: #3b3b3b; --vscode-descriptionForeground: #6b6b6b; --vscode-sideBar-background: #f8f8f8;
    --vscode-editor-background: #ffffff; --vscode-editorWidget-background: #f8f8f8; --vscode-widget-border: #e5e5e5;
    --vscode-input-background: #ffffff; --vscode-input-border: #cecece; --vscode-input-foreground: #3b3b3b;
    --vscode-input-placeholderForeground: #767676; --vscode-focusBorder: #005fb8; --vscode-list-hoverBackground: #f2f2f2;
    --vscode-list-activeSelectionBackground: #e8e8e8; --vscode-list-activeSelectionForeground: #000000;
    --vscode-button-background: #005fb8; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #0258a8;
    --vscode-button-secondaryBackground: #e5e5e5; --vscode-button-secondaryForeground: #3b3b3b; --vscode-button-secondaryHoverBackground: #cccccc;
    --vscode-textLink-foreground: #005fb8; --vscode-textCodeBlock-background: #f2f2f2; --vscode-badge-background: #cccccc;
    --vscode-badge-foreground: #3b3b3b; --vscode-menu-background: #ffffff; --vscode-menu-foreground: #3b3b3b;
    --vscode-widget-shadow: rgba(0,0,0,.16); --vscode-notifications-background: #ffffff; --vscode-icon-foreground: #3b3b3b;
    --vscode-toolbar-hoverBackground: rgba(184,184,184,.31); --vscode-textBlockQuote-border: #c8c8c8;
    background: #f8f8f8;
  }
  body { --vscode-font-family: -apple-system, "Segoe UI", system-ui, "DejaVu Sans", sans-serif; --vscode-font-size: 13px; --vscode-editor-font-family: "Cascadia Code", "DejaVu Sans Mono", Consolas, monospace; --vscode-editor-font-size: 12px; }
</style>
<link rel="stylesheet" href="/dist/webview.css" />
<script nonce="harness">
  const theme = new URLSearchParams(location.search).get('theme') || 'dark';
  document.documentElement.addEventListener('DOMContentLoaded', () => {});
  window.__posted = [];
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => window.__posted.push(m),
    getState: () => undefined,
    setState: () => undefined,
  });
  window.__host = (m) => window.postMessage(m, '*');
  document.addEventListener('DOMContentLoaded', () => document.body.classList.add('vscode-' + theme));
</script>
</head>
<body>
<div id="root" data-avatar-src="/dist/avatar.js"></div>
<script nonce="harness" src="/dist/webview.js"></script>
</body>
</html>
