name: Other feedback
description: Praise, complaints, questions about how something is meant to work.
labels: [feedback, needs-triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Your setup
      description: Optional. Filled in for you when you send feedback from the chat (`/feedback`).
      render: markdown
    validations:
      required: false
