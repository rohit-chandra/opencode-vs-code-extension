<!doctype html>
<meta charset="utf-8" />
<title>OpenCode Hub: what happens when you send a message</title>
<link rel="stylesheet" href="theme.css" />
<style>
  body {
    width: 1600px;
    padding: 44px 48px 36px;
    background: radial-gradient(1200px 520px at 50% -10%, #1a2148 0%, var(--bg) 62%);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  p.lede {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 19px;
  }
  svg text {
    font-family: 'DM Sans', 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
</style>
<h1>What happens when you send a message</h1>
<p class="lede">The same path for every engine. Only the last hop differs.</p>
<svg id="flow" width="1504" viewBox="0 0 1504 640" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
  (() => {
  const svg = document.getElementById('flow');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs, text) => {
    const n = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  };
  const lanes = [
    { x: 110, name: 'You', sub: '' },
    { x: 400, name: 'Chat webview', sub: 'Preact, sandboxed' },
    { x: 720, name: 'ChatController', sub: 'extension host' },
    { x: 1040, name: 'Engine', sub: 'one of five' },
    { x: 1380, name: 'Backend', sub: 'server, CLI or API' },
  ];
  const top = 78;
  const bottom = 610;
  el('defs', {}).innerHTML =
    '<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>';
  for (const l of lanes) {
    el('line', { x1: l.x, y1: top, x2: l.x, y2: bottom, stroke: '#2e3560', 'stroke-width': 2, 'stroke-dasharray': '2 7', 'stroke-linecap': 'round' });
    el('rect', { x: l.x - 105, y: 0, width: 210, height: 62, rx: 12, fill: '#1d2240', stroke: l.name === 'ChatController' ? 'rgba(66,224,207,.6)' : '#2e3560' });
    el('text', { x: l.x, y: l.sub ? 27 : 37, 'text-anchor': 'middle', fill: '#eef0fb', 'font-size': 18, 'font-weight': 700 }, l.name);
    if (l.sub) el('text', { x: l.x, y: 48, 'text-anchor': 'middle', fill: '#9aa3cf', 'font-size': 14 }, l.sub);
  }
  const X = (i) => lanes[i].x;
  // A numbered message between two lanes.
  const arrow = (n, from, to, y, label, opts = {}) => {
    const dir = to > from ? 1 : -1;
    const color = opts.color ?? '#42e0cf';
    el('line', { x1: X(from) + dir * 8, y1: y, x2: X(to) - dir * 8, y2: y, stroke: color, 'stroke-width': 2, 'marker-end': 'url(#a)', 'stroke-dasharray': opts.dashed ? '7 6' : '' });
    const mid = (X(from) + X(to)) / 2;
    el('text', { x: mid, y: y - 10, 'text-anchor': 'middle', fill: '#eef0fb', 'font-size': 15.5 }, label);
    if (n) {
      const bx = X(from) + dir * 30;
      el('circle', { cx: bx, cy: y, r: 12, fill: color });
      el('text', { x: bx, y: y + 5, 'text-anchor': 'middle', fill: '#06231f', 'font-size': 13.5, 'font-weight': 700 }, n);
    }
  };
  const note = (x, y, w, text) => {
    el('rect', { x: x - w / 2, y: y - 17, width: w, height: 30, rx: 15, fill: '#161a2e', stroke: '#2e3560' });
    el('text', { x, y: y + 3, 'text-anchor': 'middle', fill: '#9aa3cf', 'font-size': 14 }, text);
  };

  arrow(1, 0, 1, 116, 'type a message, press Enter');
  arrow(2, 1, 2, 166, 'send (text, attachments)');
  note(X(2), 205, 290, 'built-in /commands are answered here');
  arrow(3, 2, 3, 256, 'sendPrompt (model, text, files)');
  arrow(4, 3, 4, 306, 'HTTP request or CLI process');

  // The streaming loop.
  el('rect', { x: 60, y: 344, width: 1384, height: 150, rx: 14, fill: 'rgba(66,224,207,0.05)', stroke: 'rgba(66,224,207,0.35)', 'stroke-dasharray': '5 6' });
  el('text', { x: 78, y: 368, fill: '#42e0cf', 'font-size': 13.5, 'font-weight': 700, 'letter-spacing': '0.08em' }, 'REPEATS WHILE THE MODEL ANSWERS');
  arrow(5, 4, 3, 404, 'stream chunk', { dashed: true });
  arrow(0, 3, 2, 404, 'normalized event', { dashed: true });
  arrow(0, 2, 1, 404, 'events, grouped once per frame', { dashed: true });
  arrow(0, 1, 0, 404, 'text appears', { dashed: true });
  note(X(1), 452, 250, 'Oki reacts to tools and text');
  note(X(2), 452, 310, 'approvals take this path too, both ways');

  arrow(6, 4, 3, 536, 'token counts', { dashed: true, color: '#ffcf5c' });
  arrow(0, 3, 2, 536, 'usage event', { dashed: true, color: '#ffcf5c' });
  arrow(0, 2, 1, 536, 'updated totals', { dashed: true, color: '#ffcf5c' });
  note(X(2), 584, 380, 'UsageLedger records it once, keyed by message id');
  })();
</script>
