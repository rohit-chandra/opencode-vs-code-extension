name: Release

# Releases are automatic. When CI is green on main and the "version" in package.json has no
# release yet, this workflow tags vX.Y.Z on that commit, builds the .vsix, creates the GitHub
# release from the changelog section and publishes to the stores. A push that does not change
# the version releases nothing.
#
# The other triggers are for repairs and old habits:
#   Run workflow (on main)   build and attach whatever a failed run left missing, or publish
#                            an existing release to a store that was set up later
#   a tag, or a release      still work when the tag is "v" + the version on that commit
#   made by hand
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_again:
        description: Publish again (send a release that already exists to the stores)
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time. A release made from the Releases page fires both the tag push and
# the release event; the second run finds the files attached and stops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # After CI: only a green run for a push to main (not a pull request, not a manual run).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # After CI: exactly the commit CI tested. Otherwise the tag, or main.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_AGAIN: ${{ inputs.publish_again }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "$1"; }

          # A tag or a release made by hand has to agree with package.json on that commit.
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "release" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match \"version\": \"$version\" in package.json on that commit. Releases are automatic now: set the version in package.json on main and this workflow creates $tag itself. Delete the tag and release $GITHUB_REF_NAME if they are not wanted."
              exit 1
            fi
          fi

          # Is this version out already? "Out" means a release with the .vsix attached.
          # (gh prints the error body on a 404, so go by its exit code, not by its output.)
          exists=false
          assets=""
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            exists=true
            assets="$(jq -r '[.assets[].name] | join(" ")' "$RUNNER_TEMP/release.json")"
          fi
          case " $assets " in
            *".vsix "*)
              echo "build=false" >> "$GITHUB_OUTPUT"
              if [ "$PUBLISH_AGAIN" = "true" ]; then
                echo "publish=true" >> "$GITHUB_OUTPUT"
                say "$tag is already released. Publishing its .vsix to the stores again."
              else
                echo "publish=false" >> "$GITHUB_OUTPUT"
                say "Nothing to release: $tag is already out. A new release happens when \"version\" in package.json changes."
              fi
              ;;
            *)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              if [ "$exists" = "true" ]; then
                echo "release_exists=true" >> "$GITHUB_OUTPUT"
                say "Release $tag exists without a .vsix. Building it from ${sha:0:7} and attaching it."
              else
                echo "release_exists=false" >> "$GITHUB_OUTPUT"
                say "Releasing $tag from ${sha:0:7}."
              fi
              ;;
          esac

      - run: npm ci
        if: steps.plan.outputs.build == 'true'
      # After CI the same commit has just passed every test on three systems. A tag, a release
      # or a manual run has no such guarantee, so the tests run here.
      - name: Tests (only when CI did not just run them for this commit)
        if: steps.plan.outputs.build == 'true' && github.event_name != 'workflow_run'
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm install -g opencode-ai @anthropic-ai/claude-code @openai/codex
          npm run test:e2e
      - name: Package
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm run build:prod
          npx vsce package --no-dependencies -o "opencode-hub-$VERSION.vsix"
          sha256sum "opencode-hub-$VERSION.vsix" > "opencode-hub-$VERSION.vsix.sha256"
      - name: Release notes from the changelog
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # The section headed "## vX.Y.Z" (older sections were headed "## X.Y.Z").
          awk -v a="## v$VERSION" -v b="## $VERSION" '$0 == a || $0 == b {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "Release v$VERSION" > notes.md
      - name: Create the GitHub release
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          RELEASE_EXISTS: ${{ steps.plan.outputs.release_exists }}
        run: |
          if [ "$RELEASE_EXISTS" = "true" ]; then
            gh release upload "$TAG" "opencode-hub-$VERSION.vsix" "opencode-hub-$VERSION.vsix.sha256" --clobber
            # A release made by hand usually has no notes; give it the changelog section.
            body="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body // ""')"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            # Creates the tag on the commit that was tested, when it does not exist yet.
            gh release create "$TAG" "opencode-hub-$VERSION.vsix" "opencode-hub-$VERSION.vsix.sha256" --target "$SHA" --title "OpenCode Hub v$VERSION" --notes-file notes.md
          fi
          echo "Released: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch the .vsix of the existing release
        if: steps.plan.outputs.build != 'true' && steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release download "$TAG" --pattern '*.vsix'
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.publish == 'true'
        with:
          name: vsix
          path: opencode-hub-${{ steps.plan.outputs.version }}.vsix
          if-no-files-found: error

  publish:
    # Stores. Each step runs only when it has been set up (see docs/MAINTAINING.md):
    #   Visual Studio Marketplace  repository variable MARKETPLACE_TRUSTED_PUBLISHING = true
    #                              (Trusted Publishing: no stored token), or secret VSCE_PAT
    #   Open VSX                   secret OVSX_PAT
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets vsce prove to the Marketplace that this run comes from this repository's
      # release workflow (OpenID Connect). No long-lived token is stored anywhere.
      id-token: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      TRUSTED_PUBLISHING: ${{ vars.MARKETPLACE_TRUSTED_PUBLISHING }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Publish to the Visual Studio Marketplace (Trusted Publishing)
        if: env.TRUSTED_PUBLISHING == 'true'
        run: npx --yes @vscode/vsce publish --oidc --skip-duplicate --packagePath opencode-hub-*.vsix
      - name: Publish to the Visual Studio Marketplace (personal access token)
        if: env.TRUSTED_PUBLISHING != 'true' && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --skip-duplicate --packagePath opencode-hub-*.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish opencode-hub-*.vsix --skip-duplicate -p "$OVSX_PAT"
      - name: Say what was skipped
        if: env.TRUSTED_PUBLISHING != 'true' && env.VSCE_PAT == ''
        run: echo "::notice::Not published to the Visual Studio Marketplace, because neither Trusted Publishing nor VSCE_PAT is set up. See docs/MAINTAINING.md."
